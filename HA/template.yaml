template:

  #h6 power data
  - sensor:
    - name: "stat_h6_energy"
      unique_id: stat_h6_energy
      state: >
        {% set val = states('number.s4lo02_h6energy') | float(none) %}
        {% if val is not none %}
          {{ (val | float / 1000) | round(2) }}
        {% endif %}
      unit_of_measurement: kWh
      device_class: energy
      state_class: total_increasing

  - sensor:
    - name: "stat_h6_power"
      unique_id: stat_h6_power
      state: >
        {% set val = states('number.s4lo02_h6power') | float(none) %}
        {% set min_val = -1000 %}
        {% set max_val = 15000 %}
        {% if val is not none and val >= min_val and val <= max_val %}
        {# jinja short form {% if val is not none and -1000 <= val <= 15000 %} #}
          {{ val | round(0) }}
        {% endif %}
      unit_of_measurement: W
      device_class: power
      state_class: measurement
                                                                              
  - sensor:
    - name: "stat_h6_pv_energy"
      unique_id: stat_h6_pv_energy
      state: >
        {% set val = states('number.s4lo02_h6pvenergy') | float(none) %}
        {% if val is not none %}
          {{ (val | float / 1000) | round(2) }}
        {% endif %}
      unit_of_measurement: kWh
      device_class: energy
      state_class: total_increasing

  - sensor:
    - name: "stat_h6_pv_power"
      unique_id: stat_h6_pv_power
      state: >
        {% set val = states('number.s4lo02_h6pvpower') | float(none) %}
        {% set min_val = 0 %}
        {% set max_val = 1000 %}
        {% if val is not none and val >= min_val and val <= max_val %}
          {{ val | round(0) }}
        {% endif %}
      unit_of_measurement: W
      device_class: power
      state_class: measurement

  - sensor:
    - name: "stat_h6_pv_power_err"
      unique_id: stat_h6_pv_power_err
      state: >
        {% set val = states('number.s4lo02_h6pvpower') | float(none) %}
        {% set min_val = 0 %}
        {% set max_val = 1000 %}
        {% if val is not none and val < min_val and val > max_val %}
          {{ val | round(0) }}
        {% endif %}
      unit_of_measurement: W
      device_class: power
      state_class: measurement      

  # filtered values to get around bad lora data
  - sensor:
    - name: "stat_h6_energy_filtered"
      unique_id: stat_h6_energy_filtered
      state: >
        {% set val = states('sensor.stat_h6_energy') | float(none) %}
        {% set prev = states('sensor.stat_h6_energy_filtered') | float(0) %}
        {% set elapsed_hours = (as_timestamp(now()) - as_timestamp(states.sensor.stat_h6_energy_filtered.last_changed)) / 3600 %}
        {% set max_change_percent = 0.01 * elapsed_hours %}
        {% set max_allowed_percent = prev * (1 + max_change_percent) %}
        {% set max_allowed_absolute = prev + 0.25 %}  {# 7kW results in around 250 Wh every 2 min, the lora data send interval #}

        {% if val is not none %}
          {% if prev == 0 %}
            {{ val }}  {# bootstrap first value #}
          {% else %}
            {% set allowed = max_allowed_percent if max_allowed_percent < max_allowed_absolute else max_allowed_absolute %}
            {% if val <= allowed %}
              {{ val }}
            {% else %}
              {{ prev }}  {# reject spike #}
            {% endif %}
          {% endif %}
        {% else %}
          {{ prev }}  {# fallback if raw invalid #}
        {% endif %}
      unit_of_measurement: kWh
      device_class: energy
      state_class: total_increasing   
      
  - sensor:
    - name: "stat_h6_pv_energy_filtered"
      unique_id: stat_h6_pv_energy_filtered
      state: >
        {% set val = states('sensor.stat_h6_pv_energy') | float(none) %}
        {% set prev = states('sensor.stat_h6_pv_energy_filtered') | float(0) %}
        {% set elapsed_hours = (as_timestamp(now()) - as_timestamp(states.sensor.stat_h6_pv_energy_filtered.last_changed)) / 3600 %}
        {% set max_change_percent = 0.01 * elapsed_hours %}
        {% set max_allowed_percent = prev * (1 + max_change_percent) %}
        {% set max_allowed_absolute = prev + 0.03 %}  {# 850 W results in around 30 Wh = 0.03 kWh every 2 min, the lora data send interval #}

        {% if val is not none %}
          {% if prev == 0 %}
            {{ val }}  {# bootstrap first value #}
          {% else %}
            {% set allowed = max_allowed_percent if max_allowed_percent < max_allowed_absolute else max_allowed_absolute %}
            {% if val <= allowed %}
              {{ val }}
            {% else %}
              {{ prev }}  {# reject spike #}
            {% endif %}
          {% endif %}
        {% else %}
          {{ prev }}  {# fallback if raw invalid #}
        {% endif %}
      unit_of_measurement: kWh
      device_class: energy
      state_class: total_increasing   
